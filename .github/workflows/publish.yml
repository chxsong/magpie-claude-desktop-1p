# Publishes to npm when a version tag (v0.1.2, …) is pushed.
# Uses npm trusted publishing: no npm token or OTP is stored anywhere.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing + provenance)

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version.split('+')[0]")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Committed dist matches a fresh build
        run: npm run build && git diff --exit-code -- dist

      # prepublishOnly runs the tests, build and pack check again
      - run: npm publish --tag latest
